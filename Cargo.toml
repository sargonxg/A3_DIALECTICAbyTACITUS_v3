[workspace]
members = [
  "crates/dialectica-capsule",
  "crates/dialectica-builder",
  "crates/dialectica-cli",
  "crates/dialectica-compiler",
  "crates/dialectica-eval",
  "crates/dialectica-extractor",
  "crates/dialectica-graph",
  "crates/dialectica-store",
  "services/dialectica-api",
  "services/dialectica-mcp",
  "services/dialectica-task-handler",
  "tests/dialectica-contract-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
repository = "https://github.com/sargonxg/A3_DIALECTICAbyTACITUS_v3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
