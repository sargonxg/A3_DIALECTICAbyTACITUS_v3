resources:
  apps:
    tacitus_capsule_builder_app:
      name: "tacitus-capsule-builder-${bundle.target}"
      source_code_path: ../app
      description: "Databricks-only TACITUS Context Capsule Factory control room for PRAXIS showcase demos."
