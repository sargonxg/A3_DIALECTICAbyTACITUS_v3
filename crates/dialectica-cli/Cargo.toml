[package]
name = "dialectica-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "dialectica"
path = "src/main.rs"

[features]
default = []
ladybug = ["dialectica-graph/ladybug"]

[dependencies]
dialectica-builder = { path = "../dialectica-builder" }
dialectica-capsule = { path = "../dialectica-capsule" }
dialectica-compiler = { path = "../dialectica-compiler" }
dialectica-eval = { path = "../dialectica-eval" }
dialectica-extractor = { path = "../dialectica-extractor" }
dialectica-graph = { path = "../dialectica-graph" }
serde_json = "1"

[lints]
workspace = true
