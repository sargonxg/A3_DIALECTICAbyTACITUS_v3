    <circle cx="92" cy="182" r="9" fill="#F472B6"/>
    <circle cx="190" cy="66" r="9" fill="#A5B4FC"/>
    <circle cx="190" cy="182" r="9" fill="#86EFAC"/>
    <circle cx="226" cy="124" r="10" fill="#E5E7EB"/>
    <path d="M68 124H116M100 72L124 98M100 176L124 150M184 74L160 100M184 176L160 150M168 124H216" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <text x="26" y="232" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">source.time.graph.review</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="382" y="128" fill="#E5E7EB" font-size="68" font-weight="800" letter-spacing="2">DIALECTICA</text>
    <text x="388" y="168" fill="#2DD4BF" font-size="22" font-weight="700" letter-spacing="5">BY TACITUS</text>
    <text x="388" y="220" fill="#CBD5E1" font-size="26" font-weight="600">context capsules as the backbone of knowledge work</text>
    <text x="388" y="260" fill="#94A3B8" font-size="18">portable, reviewable knowledge objects for humans and AI agents</text>
    <text x="388" y="302" fill="#64748B" font-size="15">/ source ledger / temporal state / embedded graph / reasoning devices / human gate / PRAXIS context pack</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">
    <text x="932" y="108" fill="#64748B">capsule path</text>
    <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M960 152H1032"/>
      <path d="M960 214H1032"/>
      <path d="M960 276H1032"/>
