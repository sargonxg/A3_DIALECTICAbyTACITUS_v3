<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DIALECTICA by TACITUS</title>
  <desc id="desc">A modern technical mark for the DIALECTICA context capsule engine, showing a capsule backbone made from source, time, graph, reasoning, review, and PRAXIS nodes.</desc>
  <rect width="1280" height="420" rx="32" fill="#070B12"/>
  <rect x="28" y="28" width="1224" height="364" rx="26" fill="#0D1320" stroke="#243142" stroke-width="2"/>
