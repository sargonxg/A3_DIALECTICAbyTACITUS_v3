  <path d="M104 52V368" stroke="#111827" stroke-width="1"/>
  <path d="M1176 52V368" stroke="#111827" stroke-width="1"/>

  <g transform="translate(82 86)">
    <rect x="0" y="0" width="248" height="248" rx="44" fill="#0B1220" stroke="#4B5563" stroke-width="2"/>
    <path d="M58 124C58 82.0264 92.0264 48 134 48H150C191.974 48 226 82.0264 226 124C226 165.974 191.974 200 150 200H134C92.0264 200 58 165.974 58 124Z" fill="#101827" stroke="#2DD4BF" stroke-width="5"/>
