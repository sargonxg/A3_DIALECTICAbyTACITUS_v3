<svg width="1040" height="520" viewBox="0 0 1040 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DIALECTICA capsule stack</title>
  <desc id="desc">A source to capsule to PRAXIS diagram showing ledgers, graph, reasoning, review, and export layers.</desc>
  <rect width="1040" height="520" rx="28" fill="#0B1020"/>
  <rect x="26" y="26" width="988" height="468" rx="22" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="64" y="74" fill="#E5E7EB" font-family=" ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">DIALECTICA CAPSULE STACK</text>
  <text x="64" y="104" fill="#94A3B8" font-family=" ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">portable knowledge objects for humans and AI agents</text>

  <g font-family=" ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">
    <rect x="64" y="145" width="180" height="74" rx="10" fill="#172554" stroke="#60A5FA"/>
    <text x="88" y="176" fill="#DBEAFE">sources</text>
    <text x="88" y="198" fill="#93C5FD" font-size="12">docs feeds notes</text>

    <rect x="292" y="122" width="190" height="54" rx="10" fill="#134E4A" stroke="#2DD4BF"/>
    <text x="318" y="154" fill="#CCFBF1">source ledger</text>
    <rect x="292" y="194" width="190" height="54" rx="10" fill="#3F2D0B" stroke="#FBBF24"/>
    <text x="318" y="226" fill="#FEF3C7">time ledger</text>
    <rect x="292" y="266" width="190" height="54" rx="10" fill="#312E81" stroke="#A5B4FC"/>
    <text x="318" y="298" fill="#E0E7FF">ontology</text>

    <rect x="548" y="130" width="192" height="70" rx="10" fill="#164E63" stroke="#67E8F9"/>
    <text x="576" y="161" fill="#CFFAFE">embedded graph</text>
    <text x="576" y="183" fill="#A5F3FC" font-size="12">actors claims risks</text>
    <rect x="548" y="228" width="192" height="70" rx="10" fill="#581C87" stroke="#D8B4FE"/>
    <text x="576" y="259" fill="#F3E8FF">reasoning layer</text>
    <text x="576" y="281" fill="#E9D5FF" font-size="12">devices heuristics</text>

    <rect x="800" y="140" width="168" height="60" rx="10" fill="#7F1D1D" stroke="#FCA5A5"/>
    <text x="824" y="176" fill="#FEE2E2">human gate</text>
    <rect x="800" y="240" width="168" height="60" rx="10" fill="#14532D" stroke="#86EFAC"/>
    <text x="824" y="276" fill="#DCFCE7">signed bundle</text>
    <rect x="800" y="340" width="168" height="60" rx="10" fill="#111827" stroke="#CBD5E1"/>
    <text x="824" y="376" fill="#F8FAFC">PRAXIS</text>
  </g>

  <g stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
    <path d="M244 182H292"/>
    <path d="M244 182C260 182 264 149 292 149"/>
    <path d="M244 182C260 182 264 293 292 293"/>
    <path d="M482 149H548"/>
    <path d="M482 221C512 221 518 165 548 165"/>
    <path d="M482 293C512 293 518 263 548 263"/>
    <path d="M740 165H800"/>
    <path d="M740 263H800"/>
    <path d="M884 200V240"/>
    <path d="M884 300V340"/>
  </g>

  <g font-family=" ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="64" y="438" fill="#CBD5E1">invariant: every claim, edge, reasoning device, and output contract keeps provenance, time, review state, and rights.</text>
    <text x="64" y="464" fill="#94A3B8">PostgreSQL + signed bundle stay canonical; graph/vector/MCP/memory are derived adapters until proven by evals.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
</svg>
