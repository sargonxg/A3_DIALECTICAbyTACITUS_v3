[package]
name = "dialectica-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
dialectica-capsule = { path = "../../crates/dialectica-capsule" }
dialectica-compiler = { path = "../../crates/dialectica-compiler" }
dialectica-extractor = { path = "../../crates/dialectica-extractor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
