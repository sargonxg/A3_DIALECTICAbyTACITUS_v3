name: Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  required-docs:
    name: Required docs exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source-of-truth files
        run: |
          test -f README.md
          test -f LICENSE
          test -f AGENTS.md
          test -f docs/DIALECTICA_v3_BUILD_INSTRUCTIONS.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/MVP_DEFINITION.md
          test -f docs/CAPSULE_SPEC.md
          test -f docs/API_CONTRACT.md
          test -f docs/DATA_MODEL.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/IMPLEMENTATION_BLUEPRINT.md
          test -f docs/LOCAL_DEVELOPMENT.md
          test -f docs/CI_CD.md
          test -f docs/REPOSITORY_STRUCTURE.md
          test -f docs/BUILD_LEDGER.md
