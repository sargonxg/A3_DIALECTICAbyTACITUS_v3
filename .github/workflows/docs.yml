  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: CLI doctor
        run: cargo run -p dialectica-cli -- doctor
      - name: Validate canonical v3 capsule
        run: cargo run -p dialectica-cli -- validate fixtures/canonical-capsules/conflict-situation-capsule
      - name: Inspect canonical v3 capsule
        run: cargo run -p dialectica-cli -- inspect fixtures/canonical-capsules/conflict-situation-capsule
      - name: Check canonical v3 Ladybug projection manifest
        run: cargo run -p dialectica-cli -- ladybug-check fixtures/canonical-capsules/conflict-situation-capsule
      - name: Validate golden capsule
        run: cargo run -p dialectica-cli -- validate fixtures/golden-policy-capsule/expected-bundle
      - name: Inspect golden capsule
        run: cargo run -p dialectica-cli -- inspect fixtures/golden-policy-capsule/expected-bundle
      - name: Plan golden capsule ontology
        run: cargo run -p dialectica-cli -- ontology-plan fixtures/golden-policy-capsule/expected-bundle
      - name: Check golden source pack
        run: cargo run -p dialectica-cli -- source-pack-check fixtures/golden-policy-capsule/source-pack/source_pack.json
      - name: Check golden extraction proposals
        run: cargo run -p dialectica-cli -- proposal-check fixtures/golden-policy-capsule/build_request.json fixtures/golden-policy-capsule/source-pack/source_pack.json fixtures/golden-policy-capsule/proposals
      - name: Print golden build plan
        run: cargo run -p dialectica-cli -- build-plan fixtures/golden-policy-capsule/build_request.json fixtures/golden-policy-capsule/source-pack/source_pack.json fixtures/golden-policy-capsule/proposals
      - name: Check golden review decisions
        run: cargo run -p dialectica-cli -- review-check fixtures/golden-policy-capsule/build_request.json fixtures/golden-policy-capsule/source-pack/source_pack.json fixtures/golden-policy-capsule/proposals fixtures/golden-policy-capsule/review-decisions
      - name: Check golden promotion normalization
        run: cargo run -p dialectica-cli -- promote-check fixtures/golden-policy-capsule/build_request.json fixtures/golden-policy-capsule/source-pack/source_pack.json fixtures/golden-policy-capsule/proposals fixtures/golden-policy-capsule/review-decisions
      - name: Build golden v3 capsule package
        run: |
          out="$(mktemp -d)"
          cargo run -p dialectica-cli -- build-fixture fixtures/golden-policy-capsule --out "$out"
          cargo run -p dialectica-cli -- validate "$out"
          cargo run -p dialectica-cli -- archive "$out" --out "$RUNNER_TEMP/golden-policy.capsule"
          cargo run -p dialectica-cli -- context-pack "$out" --workflow conflict_map > "$RUNNER_TEMP/golden-context-pack.json"
          python -m json.tool "$RUNNER_TEMP/golden-context-pack.json" > /dev/null
      - name: Export schema snapshots
        run: cargo run -p dialectica-cli -- schema-export schemas/capsule-3.0

  python-tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Python tools
        run: python -m compileall tools/python
      - name: Test Python tools
        run: python -m unittest discover tools/python/tests
      - name: Validate example capsule JSON
        run: |
          python -m json.tool fixtures/example-capsules/user-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/situation-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/tool-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/output-capsule.example.json > /dev/null
