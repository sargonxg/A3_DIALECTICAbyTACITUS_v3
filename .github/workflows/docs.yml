name: Docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  required-docs:
    name: Required docs exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source-of-truth files
        run: |
          test -f README.md
          test -f Cargo.toml
          test -f rust-toolchain.toml
          test -f LICENSE
          test -f AGENTS.md
          test -f assets/dialectica-mark.svg
          test -f assets/capsule-stack.svg
          test -f assets/embedded-graph.svg
          test -f assets/agent-build-flow.svg
          test -f assets/research-ledger.svg
          test -f docs/DIALECTICA_v3_BUILD_INSTRUCTIONS.md
          test -f docs/ABOUT_DIALECTICA.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/CODING_LEDGER.md
          test -f docs/ENGINEERING_BASELINE.md
          test -f docs/LANE_A_ACCEPTANCE.md
          test -f docs/API_SLICE_1.md
          test -f docs/GRAPH_PROFILE_REGISTRY.md
          test -f docs/CAPSULE_STRUCTURE_GUIDE.md
          test -f docs/GRAPH_ONTOLOGY_RESEARCH_NOTES.md
          test -f docs/RESEARCH_LEDGER.md
          test -f docs/AGENT_BUILD_GUIDE.md
          test -f docs/REPOSITORY_CONCEPT_REVIEW.md
          test -f docs/GITHUB_PROFILE.md
          test -f docs/PYTHON_TOOLING.md
          test -f docs/SCAFFOLD_AUDIT.md
          test -f docs/FOUNDATION_BUILD.md
          test -f docs/TECH_BENCHMARK.md
          test -f docs/CAPSULE_FORMAL_MODEL.md
          test -f docs/CAPSULE_TYPES_AND_MARKETPLACE.md
          test -f docs/EMBEDDED_GRAPH_AND_SEMANTIC_LAYER.md
          test -f docs/EXPERT_REVIEW_AND_MARKETPLACE.md
          test -f docs/CAPSULE_BUILD_EXAMPLES.md
          test -f docs/CAPSULE_SPEC.md
          test -f docs/INTELLECTUAL_TOOLS.md
          test -f docs/API_CONTRACT.md
          test -f docs/DATA_MODEL.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/IMPLEMENTATION_BLUEPRINT.md
          test -f docs/LOCAL_DEVELOPMENT.md
          test -f docs/CI_CD.md
          test -f docs/REPOSITORY_STRUCTURE.md
          test -f docs/AGENTIC_WORKFLOWS.md
          test -f docs/PRAXIS_REPO_ALIGNMENT.md
          test -f docs/RESEARCH_BACKLOG.md
          test -f docs/BUILD_LEDGER.md
          test -f fixtures/example-capsules/README.md
          test -f fixtures/example-capsules/user-capsule.example.json
          test -f fixtures/example-capsules/situation-capsule.example.json
          test -f fixtures/example-capsules/thinking-device-capsule.example.json
          test -f fixtures/example-capsules/output-capsule.example.json

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: CLI doctor
        run: cargo run -p dialectica-cli -- doctor

  python-tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python tools
        run: python -m compileall tools/python
      - name: Test Python tools
        run: python -m unittest discover tools/python/tests
      - name: Validate example capsule JSON
        run: |
          python -m json.tool fixtures/example-capsules/user-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/situation-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/thinking-device-capsule.example.json > /dev/null
          python -m json.tool fixtures/example-capsules/output-capsule.example.json > /dev/null
